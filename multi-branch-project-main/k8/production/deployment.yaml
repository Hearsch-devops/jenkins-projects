apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-html-app
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-html-app
  template:
    metadata:
      labels:
        app: simple-html-app
    spec:
      containers:
      - name: simple-html-app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
apiVersion: apps/v1
kind: Deployment

metadata:
  name: simple-html-app-green

spec:
  replicas: 1

  selector:
    matchLabels:
      app: simple-html-app
      version: green

  template:
    metadata:
      labels:
        app: simple-html-app
        version: green

    spec:
      containers:
      - name: app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
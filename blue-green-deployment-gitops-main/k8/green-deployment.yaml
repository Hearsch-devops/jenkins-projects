apiVersion: apps/v1
kind: Deployment

metadata:
  name: simple-html-app-green
  namespace: blue-green-deploy

spec:
  replicas: 1

  selector:
    matchLabels:
      app: simple-html-app
      version: green

  template:
    metadata:
      labels:
        app: simple-html-app
        version: green

    spec:
      containers:
      - name: app
        image: 95337/simple-html-app:13-50f0406
        ports:
        - containerPort: 80
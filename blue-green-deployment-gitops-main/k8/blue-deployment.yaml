apiVersion: apps/v1
kind: Deployment

metadata:
  name: simple-html-app-blue
  namespace: blue-green-deploy

spec:
  replicas: 1

  selector:
    matchLabels:
      app: simple-html-app
      version: blue

  template:
    metadata:
      labels:
        app: simple-html-app
        version: blue

    spec:
      containers:
      - name: app
        image: 95337/simple-html-app:1
        ports:
        - containerPort: 80
apiVersion: apps/v1
kind: Deployment

metadata:
  name: simple-html-app
  namespace: staging

spec:
  replicas: 1

  selector:
    matchLabels:
      app: simple-html-app

  template:
    metadata:
      labels:
        app: simple-html-app

    spec:
      containers:
      - name: app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: deployment-dashboard-role
  namespace: canary-deploy

rules:

- apiGroups: ["apps"]
  resources:
    - deployments
  verbs:
    - get
    - list
    - watch

- apiGroups: [""]
  resources:
    - pods
    - services
    - endpoints
  verbs:
    - get
    - list
    - watch
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: deployment-dashboard-role
  namespace: progressive-delivery

rules:

# Deployments & ReplicaSets
- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
  verbs:
    - get
    - list
    - watch

# Pods & Services
- apiGroups: [""]
  resources:
    - pods
    - services
    - endpoints
  verbs:
    - get
    - list
    - watch

# Argo Rollouts
- apiGroups: ["argoproj.io"]
  resources:
    - rollouts
    - analysisruns
  verbs:
    - get
    - list
    - watch
apiVersion: v1
kind: Service

metadata:
  name: blackbox-exporter
  namespace: progressive-delivery

  annotations:
    k8s.grafana.com/scrape: "true"
    k8s.grafana.com/job: "blackbox-canary"

    k8s.grafana.com/metrics.path: "/probe"
    k8s.grafana.com/metrics.portName: "http"

    k8s.grafana.com/metrics.param_module: "http_2xx"
    k8s.grafana.com/metrics.param_target: "http://simple-html-canary-service.progressive-delivery.svc.cluster.local"

    # Blackbox DNS lookup can take ~10s.
    # Keep scrape timeout above the probe duration.
    k8s.grafana.com/metrics.scrapeTimeout: "30s"

spec:
  selector:
    app: blackbox-exporter

  ports:
    - name: http
      port: 9115
      targetPort: 9115

  type: ClusterIP
apiVersion: apps/v1
kind: Deployment

metadata:
  name: simple-html-app-progressive-delivery
  namespace: progressive-delivery
  

spec:
  replicas: 1

  selector:
    matchLabels:
      app: simple-html-app
      version: progressive-delivery

  template:
    metadata:
      labels:
        app: simple-html-app
        version: progressive-delivery

    spec:
      containers:
      - name: app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80